/* tema scuro: blu notte di nautargo, verderame e ottone più chiari */
:root[data-theme=dark]{--bg:#0F1A20;--bg2:#0C161B;--card:#17242C;--ink:#E6ECEA;--ink2:#C3CDD0;--muted:#8E9DA5;--faint:#6F7E86;--faint2:#4B5A62;--line:#27363F;--line2:#1E2C34;--line3:#36474F;--soft:#22323B;--teal:#3DAA9A;--tealInk:#36A190;--tealSoft:#1B3936;--tealDeep:#93D6CA;--tealFaint:#18302E;--brass:#D6AA60;--brassInk:#E6C489;--brassSoft:#3A3122;--rust:#DB8378;--rust2:#C9645A;--alarm:#A385B6;--alarmInk:#D2BCDD;--alarmSoft:#2F2638;--sky:#75A3CE;--skyInk:#A3C3E0;--we:#14212A;--knob:#F3F4F1;--group:#16242B;--gridbg:#0A1318;--slot:#17242C;--slotWe:#14202A;--slotToday:#163231;--night:rgba(117,163,206,.08);--shadow:rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;min-height:42px;outline:none;width:100%}
textarea{padding:10px 12px;resize:none;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative}
.row-c{display:flex;align-items:center}.gap6{gap:6px}.gap8{gap:8px}
.muted{color:var(--muted)}.b{font-weight:600}.strike{text-decoration:line-through;opacity:.7}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink);flex:none}
.ib.muted{color:var(--muted);width:38px}.ib.teal{color:var(--tealInk)}
.ib:active{background:var(--soft)}
.ib.act{color:var(--tealInk);background:var(--tealSoft);width:44px;height:42px}.ib.act.off{opacity:.35;pointer-events:none}
/* intestazione: viste, cerca, impostazioni; poi data, filtro, Oggi, frecce */
.wm{font-family:Poppins,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.3px}
/* barra in alto: due righe con la stessa griglia di 40 px, bordi destro e sinistro allineati */
.hdr{flex:none;padding-top:env(safe-area-inset-top);background:var(--bg)}
.hdr1,.hdr2{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px}
.hdr1{padding-top:10px}
.hdr2{justify-content:space-between;gap:8px;padding-top:8px;padding-bottom:8px}
.logo{display:flex;align-items:center;justify-content:center;gap:7px;flex:none;width:40px;height:40px}
.logo .wm{display:none;font-size:19px}
@media (min-width:760px){.logo{width:auto;padding:0 6px 0 2px}.logo .wm{display:inline}}
.hdr1 .tabs{flex:1;min-width:0}
.tabs button svg{flex:none}
.hdr1.compact .tabs button span,.hdr1.compact .gbtn span{display:none}
.hdr1.compact .gbtn{width:40px;padding:0}
.hdr1 .ib{width:40px;height:40px;border-radius:12px}
/* Attività: stessa forma delle viste, tono ottone */
.gbtn{height:40px;min-width:40px;padding:0 12px;border-radius:12px;background:var(--brassSoft);color:var(--brassInk);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;flex:none;transition:background .15s,box-shadow .15s}
.gbtn svg{color:var(--brass)}
.gbtn.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--brass),0 1px 3px var(--shadow)}
.gbtn:active{filter:brightness(.96)}
.hdr2 h1{margin:0 0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:pointer;-webkit-user-select:none;user-select:none}
/* comandi della seconda riga: 40 px, stesso bordo */
.ctl{position:relative;height:40px;min-width:40px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;flex:none;-webkit-user-select:none;user-select:none}
.ctl:active{background:var(--soft)}
.ctl.txt{padding:0 14px}
.ctl.filt{border-color:transparent;background:none;color:var(--muted)}
.ctl.filt.on{color:var(--tealInk);background:var(--tealSoft)}
.ctl.filt i{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:4px;background:var(--brass)}
@media (max-width:420px){.ctl.date span{display:none}}
.ctl-pair{display:inline-flex;border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden;flex:none;height:40px}
.ctl-pair .ctl{border:0;border-radius:0;height:38px;min-width:38px;padding:0;background:none}
.ctl-pair .ctl+.ctl{border-left:1px solid var(--line2)}
.pill{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line3);background:var(--card);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:3px;border-radius:12px;background:var(--soft)}
.seg button{height:34px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0;overflow:hidden}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px var(--shadow)}
.seg.sm button{height:30px;padding:0 10px}
.tabs{flex:none}
/* telefono in orizzontale: barra più bassa */
@media (orientation:landscape) and (max-height:520px){
  .hdr1{padding-top:4px}.hdr2{padding-top:4px;padding-bottom:4px}.hdr2 h1{font-size:17px}
  .fab{width:50px;height:50px;bottom:calc(12px + env(safe-area-inset-bottom))}
  .sheet{max-height:96%}.sheet.tall{height:96%}.splash{padding-top:40px}
}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line3);background:var(--card);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap}
.chip.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.on{border-color:var(--teal);background:var(--tealSoft);color:var(--tealDeep)}
.main{flex:1;min-height:0;display:flex;flex-direction:column}
.tile{display:inline-grid;place-items:center;flex:none}
.tile.none{background:var(--soft);color:var(--muted);border-radius:8px}
.tile.dashed{background:none;border:1.5px dashed var(--faint2)}
.dot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}.dot.lg{width:12px;height:12px;border-radius:6px}
/* griglia */
.grid{flex:1;min-height:0;display:flex;flex-direction:column}
.g-head{flex:none;display:flex;padding-right:8px}
.g-gut{width:var(--gut);flex:none;font-size:10px;color:var(--muted);text-align:right;padding-right:6px}
.g-gut.small{padding-top:6px;line-height:1.1}
.g-day{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:2px 2px 4px;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.g-day span{overflow:hidden;text-overflow:clip;padding:3px 9px;border-radius:9px;max-width:100%}
.g-day.xs{font-size:12px;font-weight:600;padding-left:0;padding-right:0}.g-day.xs span{padding:3px 5px}
.grid.narrow .g-day.xs{font-size:11px}.grid.narrow .g-day.xs span{padding:2px 4px;border-radius:7px}
.g-day.today span{background:var(--tealInk);color:#fff;font-weight:600}
.g-allday{flex:none;display:flex;padding:2px 8px 4px 0;align-items:flex-start;max-height:96px;overflow-y:auto}
.ad-chip.lift{z-index:3;box-shadow:0 6px 16px var(--shadow);opacity:.95}
.ad-chip{touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab}
.ad-area{position:relative;flex:1;min-width:0}
.ad-chip{position:absolute;height:23px;border-radius:6px;border:0 solid;border-left-width:3px;padding:0 6px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px;text-align:left;overflow:hidden}
.ad-chip.cut-l{border-left-width:0;border-radius:0 6px 6px 0}.ad-chip.cut-r{border-radius:6px 0 0 6px}.ad-chip.cut-l.cut-r{border-radius:0}
.ad-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-more{font-size:11px;color:var(--muted);padding-left:4px}
.g-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-user-select:none;user-select:none}
.g-scroll.dragging{overflow:hidden}
.g-body{position:relative;display:flex;padding-right:8px;background:linear-gradient(90deg,transparent var(--gut),var(--gridbg) var(--gut))}
.g-hours{width:var(--gut);flex:none;position:relative}
.g-hours span{position:absolute;right:6px;transform:translateY(-7px);font:400 10.5px 'Space Mono',monospace;color:var(--muted)}
.g-cols{flex:1;display:flex;position:relative;background:var(--gridbg)}
.g-col{flex:1;min-width:0;position:relative}
/* celle orarie: rettangoli arrotondati su fondo più scuro, come una griglia */
.slot{position:absolute;left:1.5px;right:1.5px;border-radius:7px;background:var(--slot);pointer-events:none}
.g-col.we .slot{background:var(--slotWe)}.g-col.today .slot{background:var(--slotToday)}
.grid.narrow .slot{border-radius:5px;left:1px;right:1px}
.grid.narrow .alm em{display:none}
.mini{display:flex;justify-content:center;align-items:center;width:100%;font-weight:700;font-size:11px;line-height:1}
.ev .mini{position:absolute;inset:0;padding:0}.rem.mini{padding:0;justify-content:center}.rem.mini .chk{margin:0;width:100%}
.grid.narrow .ev{padding:2px 1px;border-left-width:2px}
.ev{position:absolute;border-radius:7px;border:1px solid transparent;border-left-width:3px;padding:3px 6px 3px 5px;overflow:hidden;display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.2;z-index:1;touch-action:pan-y;box-shadow:0 0 0 1px var(--bg)}
.ev b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.sel{box-shadow:0 0 0 1px var(--bg),0 6px 16px rgba(14,29,42,.18);z-index:3;overflow:visible}
.ev.faded,.rem.faded{opacity:.3;box-shadow:none}
.ev.ghost{opacity:.94;box-shadow:0 10px 26px rgba(14,29,42,.22);z-index:5;overflow:visible}
/* maniglie: area di tocco ampia, restano nel DOM durante il trascinamento */
.hd{position:absolute;left:50%;width:44px;height:40px;margin-left:-22px;display:grid;place-items:center;z-index:4;touch-action:none;cursor:ns-resize}
.hd::after{content:'';width:22px;height:8px;border-radius:4px;background:var(--knob);border:2px solid currentColor;box-shadow:0 1px 3px rgba(14,29,42,.2)}
.hd.top{top:-20px}.hd.bot{bottom:-20px}
.hd.vis{pointer-events:none}.ev.faded .hd{visibility:hidden}
.rem{position:absolute;height:24px;border-radius:7px;border:1px solid transparent;border-left-width:3px;display:flex;align-items:center;gap:3px;padding-right:6px;font-size:12px;font-weight:500;z-index:2;touch-action:pan-y;box-shadow:0 0 0 1px var(--bg);overflow:hidden}
.rem span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rem.sel{box-shadow:0 4px 14px rgba(14,29,42,.16)}.rem.ghost{z-index:5;box-shadow:0 10px 26px rgba(14,29,42,.22)}
.chk{width:30px;height:30px;display:grid;place-items:center;flex:none;margin:-3px -4px -3px -2px}
.drag-time{position:absolute;left:2px;transform:translateY(-18px);font:600 10.5px 'Space Mono',monospace;color:var(--tealInk);z-index:6;background:var(--bg);padding:0 3px;border-radius:4px}
.g-top{position:sticky;top:0;z-index:8;background:var(--bg)}
.g-day.we{opacity:.72}
.grid.sx .g-scroll{overflow:auto;scroll-snap-type:x mandatory;scroll-padding-left:var(--gut);scrollbar-width:none}
.grid.sx .g-scroll.dragging{overflow:hidden}
.grid.sx .g-gut,.grid.sx .g-hours{position:sticky;left:0;z-index:6;background:var(--bg)}
.grid.sx .g-body{background:var(--gridbg)}
.grid.sx .g-cols{flex:none}
.grid.sx .g-head,.grid.sx .g-allday,.grid.sx .g-body{padding-right:0}
.grid.sx .g-col{scroll-snap-align:start}
.ev.draft{border-style:dashed;border-width:1.5px 1.5px 1.5px 3px}
.alm{position:absolute;left:0;right:0;height:22px;z-index:2;touch-action:pan-y;cursor:pointer}
.alm i{position:absolute;left:1px;right:2px;top:11px;height:7px;border-radius:4px;background:var(--alarm)}
.alm span{position:absolute;left:4px;top:-1px;max-width:calc(100% - 6px);font-size:10px;line-height:12px;font-weight:600;color:var(--alarmInk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:3px}
.alm.sel i{box-shadow:0 0 0 3px rgba(110,79,126,.22)}.alm.ghost{z-index:5}.alm.faded{opacity:.3}
/* alba e tramonto: notte velata d'azzurro e bordo a puntini, ben distinti dalla sveglia (prugna) e dall'ora attuale (ottone) */
.sun{position:absolute;left:0;right:0;height:0;border-top:1.5px dotted rgba(79,124,168,.65);pointer-events:none}
.sunl{position:absolute;right:5px;transform:translateY(-7px);font:400 9.5px 'Space Mono',monospace;color:var(--skyInk);white-space:nowrap}
.now{position:absolute;left:-4px;right:0;height:2px;background:var(--brass);z-index:3}
.now::before{content:'';position:absolute;left:-1px;top:-4px;width:10px;height:10px;border-radius:5px;background:var(--brass)}
/* mese */
.month{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.m-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:2px 16px 4px}
/* mese a griglia: ogni giorno una cella arrotondata; il mese guardato è pieno, gli altri giorni restano vuoti e tenui */
.m-fix,.m-scroll{margin:0 10px;padding:4px;border-radius:16px;background:var(--gridbg)}
.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.m-cell{min-height:52px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:4px;border-radius:10px;background:var(--slot);position:relative;overflow:hidden}
.m-cell.we{background:var(--slotWe)}
.m-cell.out{background:transparent;color:var(--faint)}
.m-cell.out .m-ics,.m-cell.out .m-tl{opacity:.55}
.m-cell.sel{box-shadow:inset 0 0 0 2px var(--teal)}
.m-n{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font-size:13px;font-weight:500}
.m-n.today{background:var(--tealInk);color:#fff;font-weight:600}
.m-scroll{flex:none;height:calc(6 * 56px + 8px);overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none}
.m-scroll.titles{height:calc(6 * 90px + 8px)}
.m-scroll .m-cell{height:52px;min-height:0;scroll-snap-align:start}
.m-scroll .m-grid.titles .m-cell{height:86px}
.m-mo{position:absolute;top:2px;left:4px;font-size:9px;font-weight:700;color:var(--tealInk);text-transform:lowercase}
.m-ics{display:flex;align-items:center;justify-content:center;gap:1px;min-height:12px;flex-wrap:nowrap;max-width:100%;overflow:hidden}
.m-ics.col{flex-direction:column;gap:3px}
.m-ics em{font-size:9px;font-weight:700;font-style:normal;color:var(--muted);line-height:1;letter-spacing:-1px}
.m-grid.titles .m-cell{min-height:86px;align-items:stretch;padding:3px 2px}
.m-grid.titles .m-n{align-self:center;width:24px;height:24px;font-size:12px}
.m-grid.titles .m-ics{align-self:center}
.m-tl{display:flex;flex-direction:column;gap:2px;min-width:0}
.m-tl span{font-size:9.5px;font-weight:600;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;border-left:2px solid transparent}
.m-tl em{font-size:9.5px;color:var(--muted);font-style:normal}
.m-list{margin-top:10px;border-top:1px solid var(--line);background:var(--card);padding:10px 16px 16px;flex:1}
.m-lh{display:flex;justify-content:space-between;align-items:center}
.m-lh h2{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--muted)}
.lnk{color:var(--tealInk);font-weight:600;font-size:14px;min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 4px}
.lnk.center{align-self:center;margin:12px auto 0;display:flex}
.m-row{display:flex;align-items:center;gap:8px;min-height:46px;border-bottom:1px solid var(--line2)}
.m-time{width:44px;flex:none;font:400 12px 'Space Mono',monospace;color:var(--muted)}
.m-open{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:6px 0}
.m-open span{font-size:14px;font-weight:500}.m-open small{font-size:11.5px;color:var(--muted)}
.pad{padding:12px 16px}.pad-x{padding:0 16px}.intro{margin:0;padding:0 16px 12px;font-size:13.5px;line-height:1.45}.sm-p{font-size:13px;margin:0 0 8px}
/* gantt */
.gantt{flex:1;min-height:0;display:flex;flex-direction:column}
.gt-tools{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px 16px}
.gt-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.gt-inner{position:relative}
.gt-head{position:sticky;top:0;z-index:4;display:flex;background:var(--bg);border-bottom:1px solid var(--line)}
.gt-corner{position:sticky;left:0;z-index:5;background:var(--bg);flex:none}
.gt-hd{position:relative;height:42px;flex:none}
.gh-m{position:absolute;top:2px;font-size:10.5px;font-weight:600;color:var(--ink2);white-space:nowrap;text-transform:lowercase}
.gh-d{position:absolute;bottom:4px;display:flex;flex-direction:column;align-items:center;font:400 9.5px 'Space Mono',monospace;color:var(--muted)}
.gh-d i{font-style:normal;font-size:8.5px}.gh-d.we{opacity:.7}.gh-d.today{color:var(--brassInk);font-weight:700}
.gh-mm{position:absolute;bottom:4px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.gh-mm i{font:400 9px 'Space Mono',monospace;font-style:normal}.gh-mm.today{color:var(--brassInk);font-weight:700}
.gt-rows{position:relative}
.gt-bg{position:absolute;top:0;bottom:0;pointer-events:none}
.gb-we{position:absolute;top:0;bottom:0;background:var(--we)}
.gb-today{position:absolute;top:0;bottom:0;width:2px;background:var(--brass);z-index:1}
.gt-row{display:flex;position:relative;border-bottom:1px solid var(--line2)}
.gt-row.cat.lv0{height:48px;border-top:1px solid var(--line)}.gt-row.cat.lv1{height:40px}.gt-row.item{height:36px}
.gt-label{position:sticky;left:0;z-index:3;flex:none;display:flex;align-items:center;gap:6px;background:var(--bg);text-align:left;padding-right:6px;min-width:0;box-shadow:1px 0 0 var(--line2)}
.gt-row.cat.lv0 .gt-label{font-weight:600;font-size:14px}
.gt-row.cat.lv1 .gt-label{font-weight:500;font-size:13px}
.gt-row.item .gt-label{font-size:12.5px;color:var(--ink2)}
.gl-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gt-track{position:relative;flex:none}
.gbar{position:absolute;top:50%;border-radius:6px}
.gbar.cat.lv0{height:12px;margin-top:-6px;opacity:.9}
.gbar.cat.lv1{height:10px;margin-top:-5px;opacity:.6}
.gbar.item{height:14px;margin-top:-7px;border:1.5px solid}
.gm{position:absolute;top:50%;transform:translateY(-50%)}
/* pulsante + */
.fab{position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:29px;background:var(--tealInk);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(14,29,42,.22);z-index:20;transition:opacity .25s}
.fab.ghost{opacity:.16}
/* fogli */
.ov{position:fixed;inset:0;z-index:70;background:rgba(14,29,42,.38);display:flex;flex-direction:column;justify-content:flex-end;animation:fade .18s ease-out}
.ov.center{justify-content:center;align-items:center;padding:24px;z-index:80}
.sheet{background:var(--card);border-radius:24px 24px 0 0;max-height:88%;display:flex;flex-direction:column;padding:6px 16px calc(14px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{height:92%}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line3);margin:4px auto 6px;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;flex:none}
.sh-head h2{margin:0;font-size:18px;font-weight:600}
.sh-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px}
.sh-foot{flex:none;display:flex;gap:10px;padding-top:10px}
.lbl{margin:14px 0 6px;font-size:12px;font-weight:500;color:var(--muted)}
.smart{display:flex;gap:10px;align-items:flex-end;border:1.5px solid var(--teal);border-radius:16px;padding:8px 8px 8px 12px;margin-top:4px}
.smart.on{box-shadow:0 0 0 3px rgba(47,145,132,.18)}
.smart-in{position:relative;flex:1;min-width:0}
.smart-hl,.smart-ta{font:400 16px/1.6 'Space Grotesk',sans-serif;padding:4px 0;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;letter-spacing:0}
.smart-hl{position:absolute;inset:0;color:var(--ink);pointer-events:none;overflow:hidden}
.smart-ta{position:relative;display:block;border:0;background:transparent;color:transparent;caret-color:var(--ink);min-height:30px;border-radius:0;padding-left:0;padding-right:0;overflow:hidden}
.smart-ta::placeholder{color:var(--faint)}
.smart-hl mark{border-radius:4px;color:inherit;padding:0}
.k-date,.k-time{background:var(--tealSoft);color:var(--tealDeep)!important}.k-alert{background:var(--brassSoft);color:var(--brassInk)!important}.k-cat,.k-rep,.k-type{background:var(--soft);color:var(--ink2)!important}
.mic{width:44px;height:44px;border-radius:22px;background:var(--tealInk);color:#fff;display:grid;place-items:center;flex:none}
.mic.on{background:var(--rust2);animation:pulse 1.2s ease-in-out infinite}
.form{margin-top:8px}
.fl{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.fl>span,.fl>label{color:var(--muted);font-size:14px;flex:none}
.fl-l{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}.fl-l svg{flex:none;opacity:.8}
.col-t .fl-l{font-size:14px}
.lnk.sm{font-size:13px;min-height:34px;margin-top:2px}
.vhelp{background:var(--tealSoft);border-radius:14px;padding:10px 12px;margin:2px 0 4px;display:flex;flex-direction:column;gap:6px}
.vhelp p{margin:0 0 2px;font-size:12.5px;line-height:1.45;color:var(--tealDeep)}
.vex{display:flex;align-items:flex-start;gap:7px;text-align:left;font-size:13px;line-height:1.35;color:var(--ink2);background:var(--card);border-radius:10px;padding:7px 9px}.vex svg{flex:none;margin-top:2px;color:var(--tealInk)}
.k-note{background:var(--alarmSoft);color:var(--alarmInk)!important}
.fl small{font-size:11.5px;opacity:.85}
.fl input,.fl select{max-width:62%;min-height:40px}
.fl input[type=date],.fl input[type=time]{max-width:58%;text-align:right}
.fl.dt input[type=date]{max-width:none;width:142px;padding:0 8px}.fl.dt input[type=time]{max-width:none;width:112px;padding:0 8px}
.col-t{display:flex;flex-direction:column;gap:2px}.col-t small{font-size:11.5px}
.wdays.bare{border-bottom:0;padding:2px 0 0}
.pt8{padding-top:8px}
.li-sel{max-width:55%;min-height:38px}
.fl.two{gap:10px}.fl.two label{display:flex;align-items:center;gap:8px;flex:1;color:var(--muted);font-size:14px}.fl.two input{max-width:none}
.fl.col{flex-direction:column;align-items:stretch;gap:6px;padding:10px 0;border-bottom:1px solid var(--line2)}
.fl.col>span,.fl.col>label{font-size:13px}
.fl.col input,.fl.col textarea{max-width:none}
.fl.btnrow b{font-weight:500;font-size:14px}
.inrow{display:flex;gap:8px;align-items:center}
.wdays{display:flex;gap:4px;padding:8px 0;border-bottom:1px solid var(--line2)}
.wdays button{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--muted)}
.wdays button.on{background:var(--tealInk);border-color:var(--tealInk);color:#fff}
.btn{height:50px;padding:0 18px;border-radius:25px;border:1px solid var(--line3);background:var(--card);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--tealInk);border-color:var(--tealInk);color:#fff}
.btn.pri:disabled{opacity:.4}
.btn.danger{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.danger-t{border:0;background:none;color:var(--rust);padding:0 12px}
.btn.wide{width:100%;margin-top:14px}.btn.grow{flex:1}
.dlg{background:var(--card);border-radius:20px;padding:20px;max-width:360px;width:100%;box-shadow:0 20px 50px rgba(14,29,42,.25)}
.dlg h3{margin:0 0 6px;font-size:17px}.dlg p{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.45}
.dlg-b{display:flex;gap:10px;justify-content:flex-end}.dlg-b .btn{height:44px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line3);position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--tealInk)}.sw.on i{left:21px}
/* schermate */
.screen{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:slide .2s ease-out}
.sc-head{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 6px;margin-top:env(safe-area-inset-top)}
.sc-head h1{margin:0;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto}
.card{background:var(--card);border-radius:16px;margin:0 16px}
.list{display:flex;flex-direction:column}
.card.list{padding:2px 0}
.li{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 12px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li.sub{padding-left:46px;min-height:44px}
.li.cur{background:var(--tealFaint)}
.li.tall{min-height:58px}
.li.teal-t{color:var(--tealInk);font-weight:600}
.li-wrap{display:flex;align-items:center}.li-wrap .li{flex:1}
.li-t{flex:1;min-width:0;font-size:14.5px}.li-t.b{font-weight:600}.li-t.col{display:flex;flex-direction:column}.li-t small{font-size:12px;color:var(--muted)}.li-t.muted{color:var(--muted)}
.sheet .list .li{padding-left:0;padding-right:0}.sheet .list .li.sub{padding-left:38px}
.num{font:400 12px 'Space Mono',monospace;color:var(--muted);flex:none}
.search{display:flex;align-items:center;gap:10px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--bg);padding:0 14px;margin-top:4px}
.search input{border:0;background:none;padding:0;min-height:0;height:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips .chip{padding-left:5px}
.tag{height:28px;padding:0 12px;border-radius:14px;background:var(--soft);color:var(--ink2);font-size:12px;font-weight:500;display:inline-flex;align-items:center}
.imp{display:flex;align-items:center;gap:12px;min-height:68px;padding:0 12px;border-bottom:1px solid var(--line2)}
.imp:last-child{border-bottom:0}.imp.off .imp-t,.imp.off .catchip{opacity:.5}
.cb{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--faint2);background:var(--card);display:grid;place-items:center;flex:none}
.cb.on{background:var(--tealInk);border-color:var(--tealInk)}
.imp-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.imp-t b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imp-t small{font-size:12.5px;color:var(--muted)}
.catchip{max-width:130px;height:28px;padding:0 10px;border-radius:14px;font-size:11.5px;font-weight:500;display:flex;align-items:center;gap:5px;flex:none}
.catchip i{width:7px;height:7px;border-radius:4px;flex:none}
.catchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:8px 16px 0}
.cats{position:relative;padding:4px 0}
.cats.dragging{-webkit-user-select:none;user-select:none}
.cblock{position:relative;background:var(--card);border-radius:12px}
.cblock.lifted,.crow.lifted{z-index:5;box-shadow:0 10px 26px rgba(14,29,42,.18);background:var(--card)}
.crow{display:flex;align-items:center;gap:4px;min-height:56px;padding:0 4px 0 2px;border-bottom:1px solid var(--line2);border-radius:10px;position:relative;background:inherit}
.crow.sub{min-height:46px;padding-left:30px}
.crow.into{background:var(--tealFaint);box-shadow:inset 0 0 0 1.5px var(--teal)}
.grip{width:36px;height:44px;display:grid;place-items:center;flex:none;cursor:grab}
.crow-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;text-align:left}
.drop-ind{position:absolute;left:14px;right:14px;height:3px;border-radius:2px;background:var(--teal);z-index:6}
.unas{display:flex;align-items:center;justify-content:space-between;margin:12px 16px 0;padding:0 18px;height:48px;border-radius:14px;border:1px dashed var(--line3);color:var(--muted);font-size:14px}
.ce-top{display:flex;align-items:flex-end;gap:14px;padding:4px 16px 4px}
.ce-top .fl{border:0}
.grow{flex:1}
input.err{border-color:var(--rust2)}.errtxt{color:var(--rust);font-size:12px}
.icons{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:8px}
.icons button{height:46px;border-radius:12px;border:2px solid transparent;color:var(--muted);display:grid;place-items:center}
.icons button.more,.swatches .more{grid-column:span 2;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--tealInk);height:40px;border-radius:12px}
.swatches{display:flex;flex-wrap:wrap;gap:12px;padding:12px}
.sws{width:34px;height:34px;border-radius:17px;flex:none}
.sws.inherit{display:grid;place-items:center;color:#fff;font-weight:700;opacity:.55}.sws.inherit.on{opacity:1;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--muted)}
.swatches .more{padding:0 12px;height:34px}
.center-col{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:20px}
/* impostazioni: un solo fondo tenue per tutti i gruppi */
.s-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 16px 16px}
.s-tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--tealInk);text-align:left;position:relative}
.s-tile b{color:var(--ink);font-size:14.5px;font-weight:600}.s-tile small{position:absolute;top:14px;right:14px;font:400 12px 'Space Mono',monospace;color:var(--muted)}
.sgroup{margin:0 16px 14px;border-radius:18px;padding:10px 12px 6px;background:var(--group)}
.sg-h{display:flex;align-items:center;gap:9px;margin:2px 2px 6px;font-size:13px;font-weight:600;letter-spacing:.1px;color:var(--tealDeep)}
.sg-i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--tealSoft);color:var(--tealInk)}
.sg-list{display:flex;flex-direction:column}
.sgroup .li{padding:0 2px;border-bottom:1px solid var(--line);min-height:52px}.sgroup .li:last-child{border-bottom:0}
.sgroup .li-t.col{padding:8px 0;gap:1px}
.si{width:30px;height:30px;display:grid;place-items:center;flex:none;color:var(--ink2);opacity:.85}
.mini-seg{flex:none;padding:2px;border-radius:10px;background:var(--card)}.mini-seg button{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.mini-seg button.on{background:var(--tealSoft);color:var(--tealDeep);box-shadow:none}
.about{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:28px;color:var(--muted);font-size:13px}
.about .wm{font-size:17px;color:var(--ink)}.about b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;max-width:86%;box-shadow:0 8px 24px rgba(14,29,42,.25);animation:fade .2s}
/* splash */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:150px 24px calc(34px + env(safe-area-inset-bottom));transition:opacity .45s;cursor:pointer}
.splash.out{opacity:0;pointer-events:none}
.sp-mid{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-word{font-family:Poppins,sans-serif;font-weight:600;font-size:46px;letter-spacing:-.8px;line-height:1;opacity:0;animation:mkfade .8s ease-out 1.5s forwards}
.sp-sub{font-size:15px;color:var(--muted);letter-spacing:.2px;opacity:0;animation:mkfade .8s ease-out 1.7s forwards}
.sp-foot{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:13px;opacity:0;animation:mkfade .8s ease-out 1.8s forwards}.sp-foot b{font-weight:600}
.sp-tap{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line3);background:var(--card);color:var(--ink2);font-weight:500;animation:breathe 2.6s ease-in-out 2.6s infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(47,145,132,0)}50%{box-shadow:0 0 0 6px rgba(47,145,132,.12)}}
.mk .mk-arc{stroke-dasharray:99.5 200;stroke-dashoffset:99.5;animation:mkdraw 1.4s cubic-bezier(.65,0,.35,1) .15s forwards}
.mk .mk-moon{transform-box:view-box;transform-origin:24px 24px;animation:mkorbit 1.4s cubic-bezier(.65,0,.35,1) .15s both}
.mk .mk-w1{opacity:0;animation:mkin .6s ease-out 1.15s forwards,mkdrift 3.4s ease-in-out 1.9s infinite}
.mk .mk-w2{opacity:0;animation:mkin .6s ease-out 1.3s forwards,mkdrift2 3.4s ease-in-out 2s infinite}
@keyframes mkdraw{to{stroke-dashoffset:0}}
@keyframes mkorbit{from{transform:rotate(0)}to{transform:rotate(300deg)}}
@keyframes mkin{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:translateX(0)}}
@keyframes mkdrift{0%,100%{transform:translateX(0)}50%{transform:translateX(-1.2px)}}
@keyframes mkdrift2{0%,100%{transform:translateX(0)}50%{transform:translateX(1.2px)}}
@keyframes mkfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,84,74,.35)}50%{box-shadow:0 0 0 8px rgba(180,84,74,0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
@media (min-width:760px){:root{--gut:54px}}
.hdr1 .ib{width:40px;height:40px}
.m-tl span{border-left:2px solid transparent}
.alm span{background:linear-gradient(90deg,var(--bg) 70%,transparent);padding-right:6px;border-radius:4px}
.ev b small{font-weight:500;font-size:10.5px;opacity:.8;margin-left:3px}
.fab.ready{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--teal),0 8px 20px rgba(14,29,42,.22)}

/* vai a data */
.dp-crumbs{display:flex;align-items:center;gap:6px;margin:4px 0 12px}
.dp-crumbs button{height:36px;padding:0 12px;border-radius:10px;background:var(--soft);font-weight:600;font-size:14px;color:var(--ink2)}
.dp-crumbs button.on{background:var(--tealInk);color:#fff}
.dp-wrap{display:flex;align-items:center;gap:8px}.dp-wrap .dp-grid{flex:1}
.dp-grid{display:grid;gap:6px}.dp-grid.c3{grid-template-columns:repeat(3,1fr)}.dp-grid.c7{grid-template-columns:repeat(7,1fr)}
.dp-grid button{height:46px;border-radius:12px;background:var(--slot);border:1px solid var(--line);font-weight:600;font-size:15px}
.dp-grid.c7 button{height:40px;font-size:14px}
.dp-grid span{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.dp-grid button.now{border-color:var(--teal);color:var(--tealInk)}
.dp-grid button.on{background:var(--tealInk);border-color:var(--tealInk);color:#fff}
/* avviso nuova versione */
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:85;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px var(--shadow);font-size:14px;max-width:calc(100% - 32px);animation:up .25s}
.upd svg{color:var(--tealInk);flex:none}.upd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib.sm{width:34px;height:34px;color:var(--muted)}
/* elenco */
.ag-tools{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px}
.chip.sel{width:auto;min-height:0;padding:0 28px 0 12px;appearance:auto}
.ag-day{margin-top:14px}
.ag-day h3{margin:0 16px 6px;font-size:13px;font-weight:600;color:var(--muted)}.ag-day h3.today{color:var(--tealInk)}
.ag-row{gap:10px}
.ag-time{width:44px;flex:none;font:400 12px 'Space Mono',monospace;color:var(--muted)}
.ag-bar{width:3px;align-self:stretch;margin:10px 0;border-radius:2px;flex:none}
.al-wrap{padding-top:12px}
.al-group,.al-tpl{background:var(--card);border-radius:16px;margin:0 16px 12px;padding:4px 12px}
.al-tpl{background:var(--group)}
.al-gh{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px}
.al-gh h3{margin:0;font-size:14px;font-weight:600;flex:1;cursor:text}.al-gh input{min-height:36px;flex:1}
.al-row{display:flex;align-items:center;gap:10px;min-height:60px;border-top:1px solid var(--line2)}
.al-row.off .al-main{opacity:.5}
.al-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;min-height:56px}
.al-time{font:600 24px 'Space Grotesk',sans-serif;letter-spacing:-.5px;color:var(--alarm);min-width:74px}
.al-group .li{border-top:1px solid var(--line2);padding:0}
.tpl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
/* importa con IA */
.steps{display:flex;flex-direction:column;gap:12px;margin:4px 0 14px}
.step{display:flex;gap:12px;align-items:flex-start;padding:0 16px;font-size:14px;line-height:1.45}
.step b{width:26px;height:26px;border-radius:13px;background:var(--tealSoft);color:var(--tealDeep);display:grid;place-items:center;flex:none;font-size:13px}
textarea.paste{font:400 13px/1.5 'Space Mono',monospace;margin-top:4px}

.drag-time.end{left:50%;transform:translate(-50%,22px);padding:1px 6px;border-radius:6px;background:var(--tealInk);color:#fff}
.grid.narrow .drag-time.end{left:0;transform:translate(0,22px)}

/* riepilogo elemento */
.iv-head{gap:8px}
.iv-type{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:12.5px;font-weight:600}
.iv-title{margin:6px 0 10px;font-size:22px;font-weight:600;letter-spacing:-.3px;line-height:1.25}
.iv-list{display:flex;flex-direction:column;background:var(--bg);border-radius:16px;padding:2px 12px}
.iv-row{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line2)}
.iv-row:last-child{border-bottom:0}
.iv-row .li-t small{font-size:12px;color:var(--muted)}
.iv-i{width:30px;display:grid;place-items:center;flex:none;color:var(--muted)}
.iv-notes{display:flex;gap:12px;padding:12px 0;align-items:flex-start}.iv-notes p{margin:0;white-space:pre-wrap;line-height:1.45;font-size:14.5px}
.li.off{opacity:.5}
.ctl.ro{border-color:var(--brass);color:var(--brassInk);background:var(--brassSoft)}
@media (max-width:420px){.ctl.ro span{display:none}}
.ag-row.off{opacity:.55}
.rem.mini{border-left-width:2px}.rem.mini svg{width:10px;height:10px}
</style>

-HH:MM` (24 ore). Senza ora l'elemento vale tutto il giorno.\n2. Campo 2: titolo breve, senza il carattere `|`.\n3. Campo 3, tipo: `evento` (ha una durata), `promemoria` (una cosa da fare, con o senza ora), `sveglia` (suona a un'ora precisa, senza categoria).\n4. Campo 4, categoria: una parola o due (es. Lavoro, Casa, Personale); per una sottocategoria usa `Categoria \u203A Sottocategoria`. Riusa sempre gli stessi nomi.\n5. Campi facoltativi, in qualsiasi ordine dopo la categoria:\n   - `ripete lun mer ven`, `ripete ogni giorno`, `ripete ogni settimana`, `ripete ogni mese`, `ripete ogni anno`\n   - `avviso 10 minuti`, `avviso 1 ora`, `avviso 1 giorno`\n   - `indirizzo: Via Roma 10, Parma`\n   - `link: https://...`\n   - `note: testo libero su una riga`\n6. Fusi orari: converti tutto nell'ora italiana.\n7. Elementi ricorrenti: una sola riga con `ripete`, non una riga per ogni volta.\n8. Se un dato \xE8 incerto, scegli l'interpretazione pi\xF9 probabile e non inventare elementi.\n\n## Dopo\n\nCopia il blocco e incollalo in hora: Impostazioni > Dati > Importa da un'altra app (riquadro \"Incolla qui\"), oppure nel campo \"Scrivi o detta\" del Nuovo. hora mostra l'elenco \"Da aggiungere\": controlla e conferma.\n";function Lv({onBack:e,onRead:t,toast:n}){let[r,l]=(0,o.useState)(""),i=async()=>{try{await navigator.clipboard.writeText(fc),n(c("copied"))}catch{As("hora-istruzioni-ia.md",fc,"text/markdown")}};return o.default.createElement(Pr,{title:c("aiImport"),onBack:e},o.default.createElement("p",{className:"muted intro"},c("aiTxt")),o.default.createElement("div",{className:"steps"},o.default.createElement("div",{className:"step"},o.default.createElement("b",null,"1"),o.default.createElement("span",null,c("aiStep1"))),o.default.createElement("div",{className:"step"},o.default.createElement("b",null,"2"),o.default.createElement("span",null,c("aiStep2"))),o.default.createElement("div",{className:"row-c gap8 pad-x"},o.default.createElement("button",{className:"btn grow",onC
